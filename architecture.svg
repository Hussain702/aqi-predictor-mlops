<svg viewBox="0 0 1180 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="1180" height="820" fill="#ffffff"/>

  <!-- ============ Data Sources ============ -->
  <rect x="60" y="30" width="230" height="58" rx="10" fill="#eafaf1" stroke="#2ecc71" stroke-width="2"/>
  <text x="175" y="55" font-size="14" font-weight="700" fill="#1e8449" text-anchor="middle">AQICN API</text>
  <text x="175" y="75" font-size="11" fill="#2ecc71" text-anchor="middle">live AQI / PM2.5 / PM10</text>

  <rect x="330" y="30" width="260" height="58" rx="10" fill="#eafaf1" stroke="#2ecc71" stroke-width="2"/>
  <text x="460" y="55" font-size="14" font-weight="700" fill="#1e8449" text-anchor="middle">OpenWeather API</text>
  <text x="460" y="75" font-size="11" fill="#2ecc71" text-anchor="middle">live temperature / humidity / wind</text>

  <rect x="850" y="30" width="270" height="58" rx="10" fill="#eaf2fb" stroke="#3498db" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="985" y="55" font-size="14" font-weight="700" fill="#21618c" text-anchor="middle">Open-Meteo Archive</text>
  <text x="985" y="75" font-size="11" fill="#3498db" text-anchor="middle">2025 historical (4 cities, one-time)</text>

  <!-- ============ Airflow dashed group: Feature Pipeline (hourly) ============ -->
  <rect x="40" y="130" width="680" height="120" rx="14" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="52" y="108" width="12" height="12" rx="3" fill="#e67e22"/>
  <text x="70" y="118" font-size="13" font-weight="700" fill="#e67e22">Airflow &#8212; feature_pipeline DAG (hourly)</text>

  <rect x="70" y="165" width="160" height="55" rx="10" fill="#fdf2e3" stroke="#e67e22" stroke-width="2"/>
  <text x="150" y="197" font-size="13" font-weight="700" fill="#af601a" text-anchor="middle">Extract</text>

  <rect x="290" y="165" width="160" height="55" rx="10" fill="#fdf2e3" stroke="#e67e22" stroke-width="2"/>
  <text x="370" y="197" font-size="13" font-weight="700" fill="#af601a" text-anchor="middle">Transform</text>

  <rect x="510" y="165" width="160" height="55" rx="10" fill="#fdf2e3" stroke="#e67e22" stroke-width="2"/>
  <text x="590" y="197" font-size="13" font-weight="700" fill="#af601a" text-anchor="middle">Load</text>

  <line x1="230" y1="192" x2="288" y2="192" stroke="#af601a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="192" x2="508" y2="192" stroke="#af601a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backfill (one-time, outside Airflow) -->
  <rect x="850" y="165" width="270" height="55" rx="10" fill="#eaf2fb" stroke="#3498db" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="985" y="197" font-size="13" font-weight="700" fill="#21618c" text-anchor="middle">backfill.py (one-time script)</text>

  <!-- sources -> extract / backfill -->
  <line x1="175" y1="88" x2="150" y2="163" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="88" x2="150" y2="163" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985" y1="88" x2="985" y2="163" stroke="#3498db" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>

  <!-- ============ Feature Store ============ -->
  <rect x="330" y="290" width="500" height="80" rx="14" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="580" y="322" font-size="16" font-weight="800" fill="#6c3483" text-anchor="middle">Hopsworks Feature Store</text>
  <text x="580" y="345" font-size="12" fill="#8e44ad" text-anchor="middle">feature group: aqi_features &#183; 4 cities &#183; 15 columns</text>

  <line x1="590" y1="220" x2="590" y2="288" stroke="#af601a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985" y1="220" x2="700" y2="288" stroke="#3498db" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <!-- history feedback loop -->
  <path d="M330,320 C 250,320 250,220 288,195" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>
  <text x="150" y="270" font-size="10.5" fill="#8e44ad">last 48h history</text>
  <text x="150" y="283" font-size="10.5" fill="#8e44ad">read back for lag/rolling features</text>

  <!-- ============ Airflow dashed group: Training Pipeline (daily) ============ -->
  <rect x="330" y="430" width="500" height="100" rx="14" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="342" y="408" width="12" height="12" rx="3" fill="#e67e22"/>
  <text x="360" y="418" font-size="13" font-weight="700" fill="#e67e22">Airflow &#8212; training_pipeline DAG (daily)</text>

  <rect x="360" y="452" width="440" height="58" rx="10" fill="#fdf2e3" stroke="#e67e22" stroke-width="2"/>
  <text x="580" y="475" font-size="13" font-weight="700" fill="#af601a" text-anchor="middle">
    train &#8594; evaluate &#8594; register
  </text>
  <text x="580" y="496" font-size="11" fill="#af601a" text-anchor="middle">
    Random Forest vs Ridge &#183; +24h / +48h / +72h
  </text>

  <line x1="580" y1="370" x2="580" y2="428" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Model Registry ============ -->
  <rect x="400" y="570" width="360" height="60" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="580" y="606" font-size="14" font-weight="800" fill="#922b21" text-anchor="middle">Hopsworks Model Registry (versioned)</text>

  <line x1="580" y1="530" x2="580" y2="568" stroke="#af601a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Dashboard ============ -->
  <rect x="330" y="690" width="500" height="90" rx="14" fill="#eaf6fb" stroke="#2980b9" stroke-width="2.5"/>
  <text x="580" y="725" font-size="16" font-weight="800" fill="#1b4f72" text-anchor="middle">Streamlit Dashboard &#8212; AeroWatch</text>
  <text x="580" y="750" font-size="12" fill="#2980b9" text-anchor="middle">Today (actual) + 3-day forecast, per city, live-refreshed</text>

  <!-- Feature Store -> Dashboard: routed around the RIGHT side to avoid crossing the middle stack -->
  <path d="M830,330 C 1000,330 1000,690 832,720" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <text x="960" y="500" font-size="10.5" fill="#8e44ad" text-anchor="middle">latest reading</text>
  <text x="960" y="513" font-size="10.5" fill="#8e44ad" text-anchor="middle">per city</text>

  <line x1="580" y1="630" x2="660" y2="688" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="60" y="800" font-size="11" fill="#555">
    <tspan font-weight="700">Legend: </tspan>
    solid arrow = data/model flow &#183; dashed arrow = one-time or read-back &#183; dashed box = Airflow-orchestrated stage
  </text>
</svg>
