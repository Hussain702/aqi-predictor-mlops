<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="380" rx="16" fill="#f7f9fc"/>

  <!-- mini header bar, echoes the real dashboard -->
  <rect x="20" y="20" width="860" height="50" rx="10" fill="url(#hdrGrad)"/>
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>
  </defs>
  <text x="40" y="52" font-size="20" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">&#127756;&#65039;</text>
  <text x="70" y="52" font-size="17" font-weight="800" fill="#ffffff">AeroWatch</text>
  <text x="740" y="51" font-size="12" fill="#cbd8f0">Lahore — 3-day forecast</text>

  <!-- 4 day cards -->
  <!-- Today: Moderate -->
  <rect x="30" y="95" width="195" height="150" rx="14" fill="#f1c40f" fill-opacity="0.13" stroke="#f1c40f" stroke-width="2"/>
  <text x="127" y="118" font-size="12" fill="#888" text-anchor="middle">Today</text>
  <text x="127" y="155" font-size="34" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">&#128993;</text>
  <text x="127" y="190" font-size="28" font-weight="800" text-anchor="middle" fill="#222">85</text>
  <text x="127" y="212" font-size="12" font-weight="700" fill="#f1c40f" text-anchor="middle">Moderate</text>

  <!-- Tomorrow: Unhealthy (Sensitive) -->
  <rect x="240" y="95" width="195" height="150" rx="14" fill="#e67e22" fill-opacity="0.13" stroke="#e67e22" stroke-width="2"/>
  <text x="337" y="118" font-size="12" fill="#888" text-anchor="middle">Tomorrow</text>
  <text x="337" y="155" font-size="34" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">&#128992;</text>
  <text x="337" y="190" font-size="28" font-weight="800" text-anchor="middle" fill="#222">132</text>
  <text x="337" y="212" font-size="11.5" font-weight="700" fill="#e67e22" text-anchor="middle">Unhealthy (Sensitive)</text>

  <!-- Day+2: Unhealthy -->
  <rect x="450" y="95" width="195" height="150" rx="14" fill="#e74c3c" fill-opacity="0.13" stroke="#e74c3c" stroke-width="2"/>
  <text x="547" y="118" font-size="12" fill="#888" text-anchor="middle">Day +2</text>
  <text x="547" y="155" font-size="34" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">&#128308;</text>
  <text x="547" y="190" font-size="28" font-weight="800" text-anchor="middle" fill="#222">178</text>
  <text x="547" y="212" font-size="12" font-weight="700" fill="#e74c3c" text-anchor="middle">Unhealthy</text>

  <!-- Day+3: Moderate -->
  <rect x="660" y="95" width="195" height="150" rx="14" fill="#f1c40f" fill-opacity="0.13" stroke="#f1c40f" stroke-width="2"/>
  <text x="757" y="118" font-size="12" fill="#888" text-anchor="middle">Day +3</text>
  <text x="757" y="155" font-size="34" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">&#128993;</text>
  <text x="757" y="190" font-size="28" font-weight="800" text-anchor="middle" fill="#222">95</text>
  <text x="757" y="212" font-size="12" font-weight="700" fill="#f1c40f" text-anchor="middle">Moderate</text>

  <!-- trend line beneath, echoing the real chart -->
  <polyline points="60,320 270,300 480,270 690,310" fill="none" stroke="#3498db" stroke-width="3"/>
  <circle cx="60" cy="320" r="5" fill="#3498db"/>
  <circle cx="270" cy="300" r="5" fill="#3498db"/>
  <circle cx="480" cy="270" r="5" fill="#3498db"/>
  <circle cx="690" cy="310" r="5" fill="#3498db"/>
  <text x="450" y="360" font-size="11" fill="#999" text-anchor="middle">
    Illustrative preview — actual values come live from your Hopsworks data
  </text>
</svg>
